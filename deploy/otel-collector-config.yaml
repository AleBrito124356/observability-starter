# OpenTelemetry Collector (contrib) configuration.
# Receives OTLP traces and logs from the app (gRPC on 4317 or HTTP on 4318):
#   - traces are forwarded to Tempo over OTLP gRPC;
#   - logs are forwarded to Loki's native OTLP endpoint over OTLP/HTTP, keeping
#     their trace_id/span_id so Grafana can link traces and logs both ways.
# Prometheus scrapes the app and the collector directly, so no metrics pipeline
# is needed here.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    # The exporter appends /v1/logs, giving Loki's http://loki:3100/otlp/v1/logs.
    endpoint: http://loki:3100/otlp
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
  telemetry:
    metrics:
      address: 0.0.0.0:8888
    logs:
      level: info
