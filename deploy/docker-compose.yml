# The full observability stack: app + collector + prometheus + tempo + loki + grafana.
# All third-party images are pinned. From the repo root:
#   docker compose -f deploy/docker-compose.yml up --build -d
#
# Signal flow:
#   traces  app --OTLP--> collector --OTLP--> tempo --(metrics generator)--> prometheus
#   logs    app --OTLP--> collector --OTLP/HTTP--> loki      (and JSON on stdout)
#   metrics prometheus --scrape--> app /metrics, collector, tempo, loki
name: observability-starter

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: observability-starter:latest
    container_name: obs_app
    environment:
      SERVICE_NAME: observability-starter
      SERVICE_VERSION: "0.2.0"
      ENVIRONMENT: docker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      # Ship logs over OTLP as well, so they reach Loki with trace_id/span_id.
      OTEL_LOGS_EXPORTER: otlp
      TRACE_SAMPLE_RATIO: "1.0"
      LOG_JSON: "true"
      LOG_LEVEL: INFO
      # Self-call so httpx CLIENT spans (and a propagated SERVER span, hence a
      # service-graph edge) appear without needing the public internet.
      UPSTREAM_URL: http://localhost:8000/
      FAILURE_RATE: "0.12"
    ports:
      - "8000:8000"
    depends_on:
      - otel-collector
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: obs_otel_collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # collector self-metrics (scraped by Prometheus)
    depends_on:
      - tempo
      - loki

  tempo:
    image: grafana/tempo:2.6.1
    container_name: obs_tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # Tempo API + /metrics

  loki:
    image: grafana/loki:3.2.1
    container_name: obs_loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - "3100:3100"   # Loki API (+ native OTLP ingestion at /otlp) + /metrics

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: obs_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
      # Tempo's metrics generator remote-writes service-graph and span metrics.
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=2h
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.2.0
    container_name: obs_grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  tempo_data:
