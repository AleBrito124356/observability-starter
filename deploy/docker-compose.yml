# The full observability stack: app + collector + prometheus + tempo + grafana.
# All images are pinned. From this directory:  docker compose up --build
name: observability-starter

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: observability-starter:latest
    container_name: obs_app
    environment:
      SERVICE_NAME: observability-starter
      SERVICE_VERSION: "0.1.0"
      ENVIRONMENT: docker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_TRACES_EXPORTER: otlp
      TRACE_SAMPLE_RATIO: "1.0"
      LOG_JSON: "true"
      LOG_LEVEL: INFO
      # Self-call so httpx spans appear without needing the public internet.
      UPSTREAM_URL: http://localhost:8000/health
      FAILURE_RATE: "0.12"
    ports:
      - "8000:8000"
    depends_on:
      - otel-collector
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: obs_otel_collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # collector self-metrics (scraped by Prometheus)
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.6.1
    container_name: obs_tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # Tempo API + /metrics

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: obs_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
      - --storage.tsdb.retention.time=2h
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.2.0
    container_name: obs_grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  tempo_data:
